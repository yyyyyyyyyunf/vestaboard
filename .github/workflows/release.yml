name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-branch:
    name: Verify tag is on release branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag points to release branch
        run: |
          git fetch origin release --no-tags
          if git ls-remote --heads origin release | grep -q release; then
            if ! git merge-base --is-ancestor ${{ github.sha }} origin/release; then
              echo "❌ Tag ${{ github.ref_name }} is not on the release branch."
              exit 1
            fi
          else
            echo "⚠️ origin/release does not exist. Skipping branch verification."
          fi
          echo "✅ Tag branch verification passed."

  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    needs: verify-branch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.dist-tag.outputs.version }}
      tag: ${{ steps.dist-tag.outputs.tag }}
      prerelease: ${{ steps.dist-tag.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js for npm
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Determine npm dist-tag
        id: dist-tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ -beta\. ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" =~ -alpha\. ]]; then
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "📦 Package version: $VERSION"
          echo "🏷️  npm dist-tag: $(cat "$GITHUB_OUTPUT" | grep '^tag=' | cut -d= -f2)"

      - name: Publish to npm
        run: |
          TAG="${{ steps.dist-tag.outputs.tag }}"
          if [ "$TAG" = "latest" ]; then
            pnpm publish --access public --provenance --no-git-checks
          else
            pnpm publish --access public --provenance --tag "$TAG" --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${{ github.ref_name }}"
          # Strip leading 'v' for matching changelog header
          PLAIN_VERSION="${VERSION#v}"
          awk '
            /^## \['"$PLAIN_VERSION"'\]|^## '"$PLAIN_VERSION"'/ { capture=1; next }
            /^## / { if (capture) exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "⚠️ No release notes found in CHANGELOG.md for $VERSION"
            echo "Automated release for $VERSION" > release-notes.md
          fi

          echo "📝 Release notes:"
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ needs.publish.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            $PRERELEASE_FLAG

  merge-release:
    name: Merge release into main
    runs-on: ubuntu-latest
    needs: github-release
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge release into main
        run: |
          git fetch origin release
          git merge origin/release --no-edit --no-ff
          git push origin main
          echo "✅ release branch merged into main."
